databases:
  - name: cardapio-online-db
    plan: free
    databaseName: cardapio
    user: cardapio

services:
  - type: web
    name: cardapio-online-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cardapio-online-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://cardapio-online-frontend.onrender.com
      - key: NODE_ENV
        value: production

  - type: static
    name: cardapio-online-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cardapio-online-backend.onrender.com
    routes:
      # SPA: qualquer caminho (/painel/login, /pedido/5, etc.) precisa servir o
      # index.html — quem decide a rota é o react-router, no navegador.
      - type: rewrite
        source: /*
        destination: /index.html
